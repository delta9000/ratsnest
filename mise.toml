[tools]
cmake = "latest"
ninja = "latest"

[tasks.configure]
description = "Configure the build directory with the dev CMake preset."
run = "cmake --preset dev"

[tasks.build]
description = "Configure with the dev preset, then build into build/."
run = """
cmake --preset dev
cmake --build build
"""

[tasks.test]
description = "Build, then run all ctest gates."
depends = ["build"]
run = "ctest --test-dir build --output-on-failure"

[tasks.test-san]
description = "Build with ASan+UBSan and run all tests against sanitized binaries."
run = """
cmake --preset san
cmake --build build-san
ctest --test-dir build-san --output-on-failure
"""

[tasks.ci]
description = "Full gate: warnings-as-errors build, tests, sanitized tests, PipeWire-free render-only build."
run = """
cmake --preset ci
cmake --build build-ci
ctest --test-dir build-ci --output-on-failure
# pkg-config hidden: a PipeWire include or link leaking into shared code fails here.
PKG_CONFIG_LIBDIR=/nonexistent cmake --preset render-only -DRATSNEST_WERROR=ON
cmake --build build-render
ctest --test-dir build-render --output-on-failure
"""
depends = ["test-san"]

[tasks.check]
description = "Parse/validate a patch file. Usage: mise run check -- patches/first.patch"
depends = ["build"]
run = "./build/ratsnest check"

[tasks.check-all]
description = "Validate every patch and subpatch under patches/."
depends = ["build"]
run = """
fail=0
for p in $(find patches -name '*.patch' -o -name '*.sub' | sort); do
  if out=$(./build/ratsnest check "$p" 2>&1); then
    printf 'ok    %s\\n' "$p"
  else
    printf 'FAIL  %s\\n%s\\n' "$p" "$out"
    fail=1
  fi
done
exit $fail
"""

[tasks.render]
description = "Render a patch to WAV offline. Usage: mise run render -- patches/first.patch -d 10s -o take.wav (also --start Ns)"
depends = ["build"]
run = "./build/ratsnest render"

[tasks.play]
description = "Play a patch live with hot-reload. Usage: mise run play -- patches/first.patch"
depends = ["build"]
run = "./build/ratsnest play"

[tasks.syx]
description = "Convert 6-op FM SysEx voices to .sub files. Usage: mise run syx -- bank.syx -o patches/dx/bank (docs/fm-syx.md)"
run = "python3 tools/syx2patch.py"

[tasks.complexity]
description = "Complexity score for src/; fails if it grows past docs/complexity.json. --hotspots lists the worst functions."
run = "python3 tools/complexity.py --check"
