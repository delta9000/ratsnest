[tools]
cmake = "latest"
ninja = "latest"

[tasks.configure]
description = "Configure the build directory with the dev CMake preset."
run = "cmake --preset dev"

[tasks.build]
description = "Configure with the dev preset, then build into build/."
run = """
cmake --preset dev
cmake --build build
"""

[tasks.test]
description = "Build, then run all ctest gates."
depends = ["build"]
run = "ctest --test-dir build --output-on-failure"

[tasks.test-san]
description = "Build with ASan+UBSan and run all tests against sanitized binaries."
run = """
cmake --preset san
cmake --build build-san
ctest --test-dir build-san --output-on-failure
"""

[tasks.ci]
description = "Full gate: warnings-as-errors build, tests, sanitized tests."
run = """
cmake --preset ci
cmake --build build-ci
ctest --test-dir build-ci --output-on-failure
"""
depends = ["test-san"]

[tasks.check]
description = "Parse/validate a patch file. Usage: mise run check -- patches/first.patch"
depends = ["build"]
run = "./build/ratsnest check"

[tasks.render]
description = "Render a patch to WAV offline. Usage: mise run render -- patches/first.patch -d 10s -o take.wav (also --start Ns)"
depends = ["build"]
run = "./build/ratsnest render"

[tasks.play]
description = "Play a patch live with hot-reload. Usage: mise run play -- patches/first.patch"
depends = ["build"]
run = "./build/ratsnest play"
